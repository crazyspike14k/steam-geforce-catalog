name: Update GeForce NOW catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate catalog
        run: |
          set -euxo pipefail
          python --version
          test -f scripts/update_catalog.py
          python -u scripts/update_catalog.py
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "Update GeForce NOW catalog"
          git push
